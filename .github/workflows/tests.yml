name: PHP SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find src tests config database/migrations examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/smoke.php
      - run: php tests/cli-smoke.php
      - run: php tests/scenarios-smoke.php
      - run: php tests/approval-smoke.php
      - run: php tests/release-smoke.php
      - run: vendor/bin/phpunit --testdox

  laravel-compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '11.*', testbench: '^9.0', php: '8.2' }
          - { laravel: '12.*', testbench: '^10.0', php: '8.3' }
          - { laravel: '13.*', testbench: '^11.0', php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      # Composer currently blocks all Laravel 11.x releases due to published advisories.
      # The override is confined to this throwaway compatibility job; never use it
      # in production install, release, or the main PHP SDK matrix.
      - name: Resolve Laravel 11 compatibility dependencies only (advisory override)
        if: matrix.laravel == '11.*'
        run: composer update --no-interaction --prefer-dist --no-progress --no-security-blocking
      - name: Resolve Laravel 12 / 13 normally
        if: matrix.laravel != '11.*'
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Report Laravel 11 dependency advisories (release blocker)
        if: matrix.laravel == '11.*'
        run: |
          if composer audit --no-interaction; then
            echo "Laravel 11 compatibility dependencies have no active advisories."
          else
            echo "::warning::Laravel 11 dependencies have known security advisories. This isolated job tests compatibility ONLY; do not use this SDK with those versions for production without a separate security review."
          fi
      - run: vendor/bin/phpunit --testdox

  package-preflight:
    name: Package archive and runtime audit (not release approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit shipped runtime dependencies (security gate)
        run: composer audit --no-dev --no-interaction
      - name: Verify offline release metadata and explicit external blockers
        run: |
          php tests/release-smoke.php
          php bin/chapa release:check --json
      - name: Build distributable Composer archive (without publishing)
        run: composer archive --format=zip --dir=/tmp
