name: PHP SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find src tests config database/migrations examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/smoke.php
      - run: php tests/cli-smoke.php
      - run: php tests/scenarios-smoke.php
      - run: php tests/approval-smoke.php
      - run: vendor/bin/phpunit --testdox

  laravel-compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '11.*', testbench: '^9.0', php: '8.2' }
          - { laravel: '12.*', testbench: '^10.0', php: '8.3' }
          - { laravel: '13.*', testbench: '^11.0', php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit --testdox
